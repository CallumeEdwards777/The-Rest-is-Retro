<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · The Rest is Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,193,7,0.16), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(60,127,114,0.14), transparent 42%),
      var(--cream);
  }
  .auth {
    width: 100%; max-width: 420px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; box-shadow: var(--shadow);
    padding: 38px 36px 34px;
  }
  .auth .logo { display: block; text-align: center; font-size: 24px; margin-bottom: 6px; }
  .auth .tagline { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 26px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--cream); border-radius: 999px; padding: 4px; margin-bottom: 26px; }
  .tabs button { border: none; background: none; padding: 10px; border-radius: 999px; font: 600 14px var(--font-body); cursor: pointer; color: var(--muted); }
  .tabs .on { background: var(--ink); color: var(--cream); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
  input {
    width: 100%; font: 15px var(--font-body);
    padding: 13px 16px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--cream);
    outline: none;
  }
  input:focus { border-color: var(--teal); }
  .btn-primary { width: 100%; margin-top: 24px; padding: 15px; font-size: 16px; }
  .hint { margin-top: 18px; text-align: center; font-size: 12.5px; color: var(--muted); }
  .hint code { background: var(--cream); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
  <form class="auth" onsubmit="location.href='browse-a-poster.html'; return false;">
    <a class="logo" href="browse-a-poster.html">The <span class="rest">Rest</span> is <span class="retro">Retro</span></a>
    <div class="tagline">Where every era lives again.</div>

    <div class="tabs">
      <button type="button" class="on">Log in</button>
      <button type="button">Sign up</button>
    </div>

    <label for="u">Username</label>
    <input id="u" placeholder="vintage_vera" autocomplete="username">

    <label for="p">Password</label>
    <input id="p" type="password" placeholder="••••••••••" autocomplete="current-password">

    <button class="btn btn-primary" type="submit">Step into your era →</button>

    <div class="hint">Demo login: <code>vintage_vera</code> / <code>password123</code></div>
  </form>
</body>
</html>
